name: Build MUNI Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout MUNI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.MUNI }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Build summary
        run: echo "MUNI Android build submitted. Open the Expo dashboard to download the APK when the build completes."