name: Build MUNI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MUNI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.MUNI }}
        run: eas build --platform android --profile preview --non-interactive

      - name: Build summary
        run: |
          echo "MUNI Android build submitted successfully."
          echo "Open the EAS build URL printed above to download the APK."
