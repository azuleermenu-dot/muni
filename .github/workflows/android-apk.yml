name: Build MUNI Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout MUNI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Align Expo dependencies
        run: npx expo install --fix --npm

      - name: Verify Expo dependencies
        run: npx expo-doctor

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify Expo configuration
        run: npx expo config --type public

      - name: Configure EAS project
        env:
          EXPO_TOKEN: ${{ secrets.MUNI }}
        run: eas project:init --account azuleermenu --force --non-interactive

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.MUNI }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download APK
        env:
          EXPO_TOKEN: ${{ secrets.MUNI }}
        run: |
          URL=$(eas build:list --platform android --status finished --limit 1 --json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s); console.log(x[0]?.artifacts?.buildUrl||'')})")
          test -n "$URL"
          curl -fL "$URL" -o MUNI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUNI-Android-APK
          path: MUNI.apk
          if-no-files-found: error

      - name: Build summary
        run: echo "MUNI.apk is available in the workflow Artifacts."